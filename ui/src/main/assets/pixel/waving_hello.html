<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{margin:0}
.fig,.head,.armL,.armR,.earL,.earR,.blink{transform-box:view-box}
.breathe{animation:breathe 3.2s ease-in-out infinite}
.bob{animation:bob 1.2s ease-in-out infinite}
.hop{animation:hop .9s ease-in-out infinite}
.headIdle{animation:headIdle 4s ease-in-out infinite}
.headWave{animation:headWave 1.2s ease-in-out infinite}
.headTilt{animation:headTilt 3s ease-in-out infinite}
.headNod{animation:headNod 1.1s ease-in-out infinite}
.blink{animation:blink 4.2s infinite}
.earsIdle.earL{animation:earL 3s ease-in-out infinite}
.earsIdle.earR{animation:earR 3s ease-in-out .3s infinite}
.earsHappy.earL{animation:earL .6s ease-in-out infinite}
.earsHappy.earR{animation:earR .6s ease-in-out .1s infinite}
.earsPerk.earL{animation:perkL 1.5s ease-in-out infinite}
.earsPerk.earR{animation:perkR 1.5s ease-in-out infinite}
.earsFlap.earL{animation:flapL .45s ease-in-out infinite}
.earsFlap.earR{animation:flapR .45s ease-in-out infinite}
.swayL{animation:swayL 3.2s ease-in-out infinite}
.swayR{animation:swayR 3.2s ease-in-out infinite}
.waveFore{transform-box:view-box;animation:waveFore 1s ease-in-out infinite}
.cupHand{transform-box:view-box;animation:cupHand 2.6s ease-in-out infinite}
.headListen{animation:headListen 2.6s ease-in-out infinite}
.earsListen.earL{animation:inL 2.6s ease-in-out infinite}
.earsListen.earR{animation:inR 2.6s ease-in-out infinite}
.gestL{animation:gestL 2.2s ease-in-out infinite}
.gestR{animation:gestR 2.2s ease-in-out .3s infinite}
.cheerL{transform-box:view-box;animation:cheerL .9s ease-in-out infinite}
.cheerR{transform-box:view-box;animation:cheerR .9s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:center;animation:bar .4s ease-in-out infinite alternate}
.lvl{transform-box:fill-box;transform-origin:center;animation:bar .7s ease-in-out infinite alternate}
.spark{transform-box:view-box;animation:spark 1.2s ease-in-out infinite}
.sw{animation:sw 1.6s ease-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.04,.96)}15%{transform:translateY(0) scale(1.06,.94)}45%{transform:translateY(-34px) scale(.97,1.04)}72%{transform:translateY(0) scale(1.07,.93)}86%{transform:translateY(0) scale(.99,1.01)}}
@keyframes headIdle{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(-2deg) translateY(-2px)}65%{transform:rotate(2deg) translateY(-1px)}}
@keyframes headWave{0%,100%{transform:rotate(4deg)}50%{transform:rotate(7deg)}}
@keyframes headTilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(-10deg) translateY(2px)}}
@keyframes headNod{0%,100%{transform:rotate(0) translateY(0)}40%{transform:rotate(1.5deg) translateY(3px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes earL{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes earR{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
@keyframes perkL{0%,100%{transform:rotate(10deg)}50%{transform:rotate(14deg)}}
@keyframes perkR{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-14deg)}}
@keyframes flapL{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(6deg)}}
@keyframes flapR{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-6deg)}}
@keyframes swayL{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
@keyframes swayR{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
@keyframes waveFore{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes cupHand{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-5deg)}}
@keyframes headListen{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(-9deg) translateY(1px)}}
@keyframes inL{0%,100%{transform:rotate(24deg)}50%{transform:rotate(30deg)}}
@keyframes inR{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(-30deg)}}
@keyframes gestL{0%,100%{transform:rotate(0)}40%{transform:rotate(18deg)}70%{transform:rotate(8deg)}}
@keyframes gestR{0%,100%{transform:rotate(0)}40%{transform:rotate(-26deg)}70%{transform:rotate(-10deg)}}
@keyframes cheerL{0%,100%{transform:rotate(0deg)}45%{transform:rotate(-10deg)}}
@keyframes cheerR{0%,100%{transform:rotate(0deg)}45%{transform:rotate(10deg)}}
@keyframes bar{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
@keyframes sw{0%{opacity:0}30%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){svg *{animation:none !important}}
